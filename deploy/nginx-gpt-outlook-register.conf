location = /gpt-register {
    return 301 /gpt-register/;
}

location ^~ /gpt-register/ {
    auth_basic "GPT Outlook Register";
    auth_basic_user_file /etc/nginx/.htpasswd-gpt-outlook-register;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /gpt-register;
    proxy_connect_timeout 10s;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_buffering off;
    proxy_set_header Accept-Encoding "";
    proxy_pass http://127.0.0.1:8766/;

    sub_filter_once off;
    sub_filter_types text/html application/javascript text/javascript;
    sub_filter '"/static' '"/gpt-register/static';
    sub_filter '"/api' '"/gpt-register/api';
    sub_filter '`/api' '`/gpt-register/api';

    add_header Cache-Control "no-store, private" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
